<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеотренажёр</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #videoContainer {
            position: relative;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
        }

        video {
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: contain;
            border-radius: 12px;
            background: #000;
            display: block;
        }

        #choices {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            padding: 0 16px;
            text-align: center;
            z-index: 10;
        }

        #choices button {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s;
            backdrop-filter: blur(4px);
        }

        #choices button:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #fff;
        }

        /* Класс для плавного исчезновения нажатой кнопки */
        #choices button.removing {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Выбери свой путь</h1>

    <div id="videoContainer">
        <video id="myVideo" controls preload="auto">
            <source id="videoSource"
                    src="videos/start.mp4"
                    type="video/mp4">
        </video>

        <div id="choices">
            <button onclick="choose('a', this)">Открыть книгу</button>
            <button onclick="choose('b', this)">Убрать книгу</button>
            <button onclick="choose('c', this)">Перевернуть книгу</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const videoSource = document.getElementById('videoSource');
        const choicesDiv = document.getElementById('choices');
        const BASE_URL = "videos/";

        // Когда видео заканчивается — показываем оставшиеся кнопки
        video.addEventListener('ended', function() {
            // Показываем блок, только если в нём ещё есть кнопки
            if (choicesDiv.children.length > 0) {
                choicesDiv.style.display = 'block';
            }
        });

        // Функция выбора
        function choose(option, button) {
            // 1. Плавно скрываем НАЖАТУЮ кнопку
            button.classList.add('removing');

            // 2. Через 300 мс удаляем её из DOM навсегда
            setTimeout(() => {
                button.remove();

                // Если кнопок не осталось — скрываем блок
                if (choicesDiv.children.length === 0) {
                    choicesDiv.style.display = 'none';
                }
            }, 300);

            // 3. Скрываем блок, пока идёт новое видео
            choicesDiv.style.display = 'none';

            // 4. Определяем следующее видео
            let nextVideo;
            if (option === 'a') {
                nextVideo = 'choice-a.mp4';
            } else if (option === 'b') {
                nextVideo = 'choice-b.mp4';
            } else {
                nextVideo = 'choice-c.mp4';
            }

            // 5. Загружаем и запускаем новое видео
            videoSource.src = BASE_URL + nextVideo;
            video.load();
            video.play();
        }
    </script>

</body>
</html>
